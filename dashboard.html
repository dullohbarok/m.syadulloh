<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | KELAS BISINDO CIANJUR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>KELAS BISINDO CIANJUR</h1>
        <p>Media Pembelajaran Bahasa Isyarat Indonesia</p>
    </header>

    <main class="container">
        <section>
            <h3><span class="icon">🔤</span> Abjad (26 Huruf)</h3>
            <div class="grid-container">
                <script>
                    for(let i=65; i<=90; i++) {
                        let huruf = String.fromCharCode(i);
                        document.write(`<a href="https://www.youtube.com/results?search_query=BISINDO+huruf+${huruf}" target="_blank" class="grid-item">${huruf}</a>`);
                    }
                </script>
            </div>
        </section>

        <section>
            <h3><span class="icon">🔢</span> Angka (1 - 30)</h3>
            <div class="grid-container">
                <script>
                    for(let i=1; i<=30; i++) {
                        document.write(`<a href="https://www.youtube.com/results?search_query=BISINDO+angka+${i}" target="_blank" class="grid-item">${i}</a>`);
                    }
                </script>
            </div>
        </section>

        <section>
            <h3><span class="icon">👋</span> Sapaan (10 Kata)</h3>
            <div class="grid-container">
                <a href="#" class="grid-item wide">Halo</a>
                <a href="#" class="grid-item wide">Terima Kasih</a>
                <a href="#" class="grid-item wide">Maaf</a>
                <a href="#" class="grid-item wide">Selamat Pagi</a>
                </div>
        </section>
    </main>
</body>
</html>
