<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | KELAS BISINDO CIANJUR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h2>Pendaftaran Peserta <br> KELAS BISINDO CIANJUR</h2>
        <form id="registrationForm">
            <input type="text" placeholder="Nama Lengkap" required>
            <input type="text" placeholder="Alamat" required>
            <input type="text" placeholder="Pekerjaan" required>
            <input type="email" placeholder="Email (Contoh: user@gmail.com)" required>
            <input type="password" placeholder="Password" required>
            
            <button type="submit" class="btn-primary">Daftar & Masuk</button>
            <hr>
            <button type="button" class="btn-google">Masuk Otomatis dengan Gmail</button>
        </form>
    </div>

    <script>
        // Simulasi Login sederhana untuk GitHub Pages
        document.getElementById('registrationForm').onsubmit = function(e) {
            e.preventDefault();
            alert('Pendaftaran Berhasil! Menuju Dashboard...');
            window.location.href = 'dashboard.html';
        };
        const firebaseConfig = {
  apiKey: "AIzaSyB5ezwsr9r5V8z-e4dlmcxOLY275JJKFSY",
  authDomain: "kelas-bisindo-cianjur.firebaseapp.com",
  databaseURL: "https://kelas-bisindo-cianjur-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kelas-bisindo-cianjur",
  storageBucket: "kelas-bisindo-cianjur.firebasestorage.app",
  messagingSenderId: "563728400620",
  appId: "1:563728400620:web:cdebe0585aeef99f3da5c9",
  measurementId: "G-G6VFSFD8RW"
};
        // Inisialisasi Firebase
firebase.initializeApp(firebaseConfig);
const database = firebase.database();

// Fungsi saat tombol daftar diklik
function simpanData(nama, alamat, pekerjaan, email) {
    const pesertaRef = database.ref('peserta');
    const pesertaBaru = pesertaRef.push(); // Membuat ID unik otomatis
    
    pesertaBaru.set({
        nama_lengkap: nama,
        alamat: alamat,
        pekerjaan: pekerjaan,
        email: email,
        waktu_daftar: new Date().toISOString()
    }).then(() => {
        alert("Data tersimpan! Selamat belajar.");
        window.location.href = "dashboard.html";
    });
}
    </script>
</body>
</html>
