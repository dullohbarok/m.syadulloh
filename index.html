<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | KELAS BISINDO CIANJUR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h2>Pendaftaran Peserta <br> KELAS BISINDO CIANJUR</h2>
        <form id="registrationForm">
            <input type="text" placeholder="Nama Lengkap" required>
            <input type="text" placeholder="Alamat" required>
            <input type="text" placeholder="Pekerjaan" required>
            <input type="email" placeholder="Email (Contoh: user@gmail.com)" required>
            <input type="password" placeholder="Password" required>
            
            <button type="submit" class="btn-primary">Daftar & Masuk</button>
            <hr>
            <button type="button" class="btn-google">Masuk Otomatis dengan Gmail</button>
        </form>
    </div>

    <script>
        // Simulasi Login sederhana untuk GitHub Pages
        document.getElementById('registrationForm').onsubmit = function(e) {
            e.preventDefault();
            alert('Pendaftaran Berhasil! Menuju Dashboard...');
            window.location.href = 'dashboard.html';
        };
    </script>
</body>
</html>
