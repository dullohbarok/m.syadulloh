<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login - KELAS BISINDO CIANJUR</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #2c3e50; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .google-btn { background: #db4437; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>KELAS BISINDO CIANJUR</h2>
        <form action="dashboard.html">
            <input type="text" placeholder="Nama Lengkap" required>
            <input type="text" placeholder="Alamat" required>
            <input type="text" placeholder="Pekerjaan" required>
            <input type="email" placeholder="Email (Gmail)" required>
            <input type="password" placeholder="Password" required>
            <button type="submit">Daftar & Masuk</button>
        </form>
        <button class="google-btn" onclick="location.href='dashboard.html'">Masuk Otomatis dengan Gmail</button>
    </div>
</body>
</html>
